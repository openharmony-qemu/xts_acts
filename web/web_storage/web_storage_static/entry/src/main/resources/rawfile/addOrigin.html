<!DOCTYPE HTML>
<html>
<head>
    <meta charset='UTF-8'>
    <script type='text/javascript'>

        document.addEventListener('DOMContentLoaded', function() {
            let request = indexedDB.open('mydb', 1);

            request.onupgradeneeded = function(event) {
                let db = event.target.result;
                if (!db.objectStoreNames.contains('logs')) {
                    let objectStore = db.createObjectStore('logs', { keyPath: 'id' });
                    // 添加一些初始数据
                    let data = [
                        {id: 1, log: 'W3Cschool教程'},
                        {id: 2, log: 'www.w3cschool.cn'}
                    ];
                    data.forEach(function(item) {
                        let request = objectStore.add(item);
                        request.onerror = function(event) {
                            console.error('Unable to add data: ', event.target.error);
                        };
                    });
                }
            };

            request.onsuccess = function(event) {
                let db = event.target.result;
                let transaction = db.transaction(['logs'], 'readonly');
                let objectStore = transaction.objectStore('logs');

                let request = objectStore.getAll();
                request.onsuccess = function(event) {
                    let logs = event.target.result;
                    let msg = '<p>查询记录条数: ' + logs.length + '</p>';
                    document.querySelector('#status').innerHTML = msg;

                    logs.forEach(function(log) {
                        msg = '<p><b>' + log.log + '</b></p>';
                        document.querySelector('#status').innerHTML += msg;
                    });
                };

                request.onerror = function(event) {
                    console.error('Unable to retrieve data: ', event.target.error);
                };
            };

            request.onerror = function(event) {
                console.error('Database error: ', event.target.error);
            };
        });

    </script>
</head>
<body>
<div id='status'>状态信息</div>
</body>
</html>
