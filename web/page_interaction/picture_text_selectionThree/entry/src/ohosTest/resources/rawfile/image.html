<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片元素在不同HTML标签中的应用</title>
    <style>
        .container {
          display: flex;
          justify-content: center; /* 水平居中 */
          align-items: center;     /* 垂直居中 */
          height: 100vh;           /* 占满整个视口高度 */
        }
    </style>
</head>
<body>
<div class="container">
        <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='400'%3E%3Crect width='100%25' height='100%25' fill='%2360a5fa'/%3E%3Ccircle cx='200' cy='200' r='120' fill='%23ffffff'/%3E%3C/svg%3E" alt="" width="400" height="400">
</div>
</body>
</html>
