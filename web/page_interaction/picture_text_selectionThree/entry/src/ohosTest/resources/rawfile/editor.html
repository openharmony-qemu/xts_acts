<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>editor</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        .panel {
            margin: 0 auto;
            max-width: 720px;
            background: #ffffff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .title {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .field {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #cfd3d8;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="panel">
    <h2 class="title">Password AutoFill Local Page</h2>
    <input class="field" type="text" autocomplete="username" placeholder="username">
    <input class="field" type="password" autocomplete="current-password" placeholder="password">
    <div class="field" contenteditable="true">Long press here to open context menu and trigger requestPasswordAutoFill.</div>
</div>
</body>
</html>
