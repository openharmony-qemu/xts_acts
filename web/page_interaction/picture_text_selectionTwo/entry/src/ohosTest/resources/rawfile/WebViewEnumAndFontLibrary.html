<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <style>
        .contain {
                  position: relative; /* 父元素设为相对定位 */
                  height: 100vh; /* 示例：父元素高度为视口高度 */
                  border: 1px solid #ccc;
              }
              #fileAccess2 {
                  position: absolute;
                  top: 50%;
                  left: 50%;
                  transform: translate(-50%, -50%); /* 通过平移自身宽高的50%实现居中 */
                  width: 300px;
                  height: 100px;
                  background-color: lightblue;
                  text-align: center;
                  line-height: 100px;
              }
    </style>
</head>
<body>
    <div id="contain">
        <a href="http://www.baidu.com"  id="fileAccess2" style="font-size:27px">链接www.baidu.com</a>
    </div>
</body>
