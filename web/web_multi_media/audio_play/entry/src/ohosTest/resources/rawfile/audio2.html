<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Audio Pause Test</title>
</head>

<body>
<audio controls id="myAudio1">
    <source src="./01.mp3" type="audio/mpeg">
</audio>

<audio controls id="myAudio2">
    <source src="./01.mp3" type="audio/mpeg">
</audio>

<button onclick="pauseAudio1()">Pause Audio 1</button>
<button onclick="playAudio1()">Play Audio 1</button>

<button onclick="pauseAudio2()">Pause Audio 2</button>
<button onclick="playAudio2()">Play Audio 2</button>

<script>
        function pauseAudio1() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.pause();
        }

        function playAudio1() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.play();
        }

        function pauseAudio2() {
            var audioElement = document.getElementById('myAudio2');
            audioElement.pause();
        }

        function playAudio2() {
            var audioElement = document.getElementById('myAudio2');
            audioElement.play();
        }
    </script>

</body>

</html>
