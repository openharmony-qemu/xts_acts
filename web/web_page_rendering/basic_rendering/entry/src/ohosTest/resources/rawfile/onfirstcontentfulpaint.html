<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FCP Offline</title>
</head>
<body>
<h1>这里是直出的内容</h1>
<img src="icon.png" alt="icon" width="200">
<hr/>
<h1>下面是异步加载的内容</h1>
<img src="icon.png" alt="icon" id="imgs">
<h2 id="title"></h2>
<div id="app"></div>
<script>
let ele=document.getElementById("imgs");
ele.onload=function() {};
setTimeout(() => {
  for (let i = 0; i < 50; i++) {
    let newDiv = document.createElement("div");
    newDiv.textContent = "异步回来的内容 " + i;
    document.querySelector('#app').appendChild(newDiv);
  }
  document.querySelector('#title').innerText = "第 1 次异步";
}, 50);
</script>
</body>
</html>
