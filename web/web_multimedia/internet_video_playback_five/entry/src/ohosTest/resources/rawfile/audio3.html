<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Video Pause Test</title>
</head>

<body>
    <video controls height="360" id="myVideo" width="640">
        <source
            src="./02.mp4"
            type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <audio controls id="myAudio1">
        <source
            src="./01.mp3"
            type="audio/mpeg">
    </audio>
    <audio controls id="myAudio2">
        <source
            src="./01.mp3"
            type="audio/mpeg">
    </audio>

    <script>
        function playAudio2() {
            var audioElement = document.getElementById('myAudio2');
            audioElement.play();
        }
        function pauseAudio1() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.pause();
        }
        function pauseAudio2() {
            var audioElement = document.getElementById('myAudio2');
            audioElement.pause();
        }

        function pauseVideo() {
            var videoElement = document.getElementById('myVideo');
            videoElement.pause();
        }
        function playVideo() {
            var videoElement = document.getElementById('myVideo');
            videoElement.play();
        }
        function playAudio1() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.play();
        }
    </script>
</body>

</html>
