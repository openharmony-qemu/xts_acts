<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Audio Pause Test</title>
</head>

<body>
<audio controls id="myAudio1">
    <source src="./01.mp3"
            type="audio/mpeg">
</audio>
<button onclick="pauseAudio()">Pause Audio</button> <!-- 暂停按钮 -->
<button onclick="playAudio()">Play Audio</button> <!-- 播放按钮 -->
<script>
        function pauseAudio() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.pause();
        }

        function playAudio() {
            var audioElement = document.getElementById('myAudio1');
            audioElement.play();
        }
    </script>

</body>

</html>
