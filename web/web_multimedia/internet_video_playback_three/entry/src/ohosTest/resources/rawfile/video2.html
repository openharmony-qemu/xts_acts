<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Video Pause Test</title>
</head>

<body>
    <video controls height="360" id="myVideo1" width="640">
        <source
            src="./02.mp4"
            type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <video controls height="360" id="myVideo2" width="640">
        <source
            src="./02.mp4"
            type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <script>
        function pauseVideo1() {
            var videoElement = document.getElementById('myVideo1');
            videoElement.pause();
        }
        function playVideo1() {
            var videoElement = document.getElementById('myVideo1');
            videoElement.play();
        }
        function pauseVideo2() {
            var videoElement = document.getElementById('myVideo2');
            videoElement.pause();
        }
        function playVideo2() {
            var videoElement = document.getElementById('myVideo2');
            videoElement.play();
        }
        function enterFullScreen1() {
            var videoElement = document.getElementById("myVideo1");
            if (!videoElement.fullscreenElement) {
                if (videoElement.requestFullscreen) {
                    videoElement.requestFullscreen();
                } else if (videoElement.mozRequestFullScreen) {
                    videoElement.mozRequestFullScreen();
                } else if (videoElement.webkitRequestFullscreen) {
                    videoElement.webkitRequestFullscreen();
                } else if (videoElement.msRequestFullscreen) {
                    videoElement.msRequestFullscreen();
                }
            }
        }
        function exitFullScreen1() {
            var videoElement = document.getElementById("myVideo1");
            if (videoElement.exitFullscreen) {
                videoElement.exitFullscreen();
            } else if (videoElement.mozCancelFullScreen) { /* Firefox */
                videoElement.mozCancelFullScreen();
            } else if (videoElement.webkitExitFullscreen) { /* Chrome, Safari and Opera */
                videoElement.webkitExitFullscreen();
            } else if (videoElement.msExitFullscreen) { /* IE/Edge */
                videoElement.msExitFullscreen();
            }
        }
        function enterFullScreen2() {
            var videoElement = document.getElementById("myVideo2");
            if (!videoElement.fullscreenElement) {
                if (videoElement.requestFullscreen) {
                    videoElement.requestFullscreen();
                } else if (videoElement.mozRequestFullScreen) {
                    videoElement.mozRequestFullScreen();
                } else if (videoElement.webkitRequestFullscreen) {
                    videoElement.webkitRequestFullscreen();
                } else if (videoElement.msRequestFullscreen) {
                    videoElement.msRequestFullscreen();
                }
            }
        }
        function exitFullScreen2() {
            var videoElement = document.getElementById("myVideo2");
            if (videoElement.exitFullscreen) {
                videoElement.exitFullscreen();
            } else if (videoElement.mozCancelFullScreen) {
                videoElement.mozCancelFullScreen();
            } else if (videoElement.webkitExitFullscreen) {
                videoElement.webkitExitFullscreen();
            } else if (videoElement.msExitFullscreen) {
                videoElement.msExitFullscreen();
            }
        }
        function isVideoFullScreen1() {
            var videoElement = document.getElementById("myVideo1");
            if (!videoElement) {
                return 0;
            }
            if (document.fullscreenElement === videoElement ||
                document.mozFullScreenElement === videoElement ||
                document.webkitFullscreenElement === videoElement ||
                document.msFullscreenElement === videoElement) {
                return 1;
            } else {
                return 0;
            }
        }
        function isVideoFullScreen2() {
            var videoElement = document.getElementById("myVideo2");
            if (!videoElement) {
                return 0;
            }
            if (document.fullscreenElement === videoElement ||
                document.mozFullScreenElement === videoElement ||
                document.webkitFullscreenElement === videoElement ||
                document.msFullscreenElement === videoElement) {
                return 1;
            } else {
                return 0;
            }
        }
    </script>

</body>

</html>
